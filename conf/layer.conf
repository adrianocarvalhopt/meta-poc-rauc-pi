# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-poc-rauc-pi"
BBFILE_PATTERN_meta-poc-rauc-pi = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-poc-rauc-pi = "90"
LAYERVERSION_meta-poc-rauc-pi = "1"
LAYERSERIES_COMPAT_meta-poc-rauc-pi = "walnascar whinlatter"
